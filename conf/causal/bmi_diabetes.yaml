schema_version: 1
question_id: bmi_diabetes
title: Obesity-range BMI and diagnosed diabetes
source_question_registry: conf/causal/questions.yaml
data:
  year: 2023
  base_dir: data
  input_path: null
  sample_path: data/sample/integrated_person_year_sample.csv
  use_sample_if_missing: true
treatment_derivation:
  kind: bmi_obesity_vs_normal
  source_column: bmi
  normal_min: 18.5
  normal_max: 25.0
  obesity_min: 30.0
outcome:
  label_field: label_diabetes
columns:
  treatment: obesity_range_bmi
  outcome: label_diabetes
  sample_weight: survey_weight
  required:
    - year
    - state_fips
    - sex
    - race_ethnicity
    - age
    - bmi
    - smoker
    - alcohol_servings_per_week
    - exercise_minutes_per_week
    - annual_aqi
    - has_healthcare_coverage
    - has_personal_doctor
    - cost_barrier_to_care
    - last_checkup_within_year
    - label_diabetes
    - survey_weight
  adjustment:
    - age
    - sex
    - race_ethnicity
    - smoker
    - alcohol_servings_per_week
    - exercise_minutes_per_week
    - annual_aqi
    - has_healthcare_coverage
    - has_personal_doctor
    - cost_barrier_to_care
    - last_checkup_within_year
    - state_fips
    - year
  categorical:
    - sex
    - race_ethnicity
    - state_fips
    - year
  excluded:
    - label_diabetes_components
    - hypertension_or_cardiovascular_disease
    - physical_health_days
    - weight_loss_after_diagnosis
    - model_outputs
exclusion_rules:
  - kind: numeric_range
    name: outside_adult_age_range
    column: age
    min: 18
    max: 100
assumptions:
  - "Consistency: the processed BMI field represents the obesity-versus-normal contrast."
  - "Exchangeability: measured adjustment columns block confounding paths named in the DAG."
  - "Positivity: comparable obesity-range and normal-range respondents exist across adjustment strata."
  - "Survey weights approximate the eligible BRFSS adult population for descriptive weighting."
diagnostics:
  min_propensity: 0.05
  max_propensity: 0.95
  trim_min_propensity: 0.05
  trim_max_propensity: 0.95
  max_abs_smd_warning: 0.25
estimator:
  method: weighted_logistic_g_computation
  random_state: 42
reports:
  output_dir: data/processed/reports/causal/bmi_diabetes
  json_name: bmi_diabetes_report.json
  markdown_name: bmi_diabetes_report.md
serving_policy:
  api_exposed: false
  ui_exposed: false
  statement: Causal workbench reports are not served through API or UI.
