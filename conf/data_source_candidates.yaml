  "rubric": [
    {
      "criterion": "Public access",
      "required_evidence": "Official public landing page plus a scriptable download/API path; no private credentials, proprietary datasets, or manual-only exports.",
      "pass_condition": "The access method can be automated and cited from an official source without storing secrets."
    },
    {
      "criterion": "Join feasibility",
      "required_evidence": "Documented geography and time keys that can support state-year, county-year, tract-year, or separate validation semantics.",
      "pass_condition": "The source has a defensible join path or is explicitly marked validation-only with no row join to BRFSS."
    },
    {
      "criterion": "Prior signal rationale",
      "required_evidence": "A plausible relationship to modeled conditions, scenario sensitivity, contextual explanation, fairness review, or external validation.",
      "pass_condition": "The source is not added just because it is available; it must target a named model/report use."
    },
    {
      "criterion": "Bias review",
      "required_evidence": "Known limitations, modeled-estimate risks, missingness, suppression, survey coverage, ecological fallacy, and temporal mismatch are recorded.",
      "pass_condition": "A future PR can present the source with caveats that match the measurement process."
    },
    {
      "criterion": "Operational fit",
      "required_evidence": "Expected local size, processing complexity, and deployment implications are compatible with the local-first repo.",
      "pass_condition": "Raw and processed outputs remain gitignored, and a dev/sample path can be kept small."
    },
    {
      "criterion": "Ablation plan",
      "required_evidence": "A concrete first experiment or an explicit no-training decision for context-only and validation-only sources.",
      "pass_condition": "Future ingestion defines what lift, stability, or validation check would justify retaining the source."
    }
  ],
