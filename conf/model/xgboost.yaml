defaults:
  - _self_

name: xgboost
kind: xgboost
class_imbalance_strategy: scale_pos_weight
params:
  n_estimators: 300
  max_depth: 3
  learning_rate: 0.05
  subsample: 0.9
  colsample_bytree: 0.9
  reg_lambda: 1.0
  tree_method: hist
  eval_metric: logloss
monotonic_constraints:
  age: 1
  bmi: 1
  smoker: 1
  alcohol_servings_per_week: 0
  exercise_minutes_per_week: -1
  annual_aqi: 1
