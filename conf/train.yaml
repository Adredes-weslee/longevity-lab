defaults:
  - model: decision_tree
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false

bundle_id: null

data:
  year: 2023
  base_dir: data
  input_path: null
  sample_path: data/sample/integrated_person_year_sample.csv
  use_sample_if_missing: true

artifacts:
  base_dir: artifacts/models
  force_overwrite: false
  notes: "Tree baseline bundle with calibrated probability outputs."

features:
  - age
  - bmi
  - smoker
  - alcohol_servings_per_week
  - exercise_minutes_per_week
  - annual_aqi
  - pm25_mean
  - ozone_mean
  - sex
  - race_ethnicity
  - has_healthcare_coverage
  - has_personal_doctor
  - cost_barrier_to_care
  - last_checkup_within_year
  - sleep_hours_per_night
  - physical_health_days
  - mental_health_days

feature_contract:
  version: brfss_v2
  scenario_editable_features:
    - age
    - bmi
    - smoker
    - alcohol_servings_per_week
    - exercise_minutes_per_week
    - annual_aqi
    - pm25_mean
    - ozone_mean
  adjustment_features:
    - sex
    - race_ethnicity
    - has_healthcare_coverage
    - has_personal_doctor
    - cost_barrier_to_care
    - last_checkup_within_year
    - sleep_hours_per_night
    - physical_health_days
    - mental_health_days
  context_features: []
  sample_weight_column: survey_weight
  label_feature_exclusions:
    heart_disease:
      - physical_health_days
    chronic_lung_disease:
      - physical_health_days
    asthma:
      - physical_health_days
    stroke:
      - physical_health_days
    depression:
      - mental_health_days
    diabetes:
      - physical_health_days
    kidney_disease:
      - physical_health_days
    arthritis:
      - physical_health_days

conditions:
  heart_disease: label_heart_disease
  chronic_lung_disease: label_chronic_lung_disease
  asthma: label_asthma
  stroke: label_stroke
  depression: label_depression
  diabetes: label_diabetes
  kidney_disease: label_kidney_disease
  arthritis: label_arthritis

training:
  random_state: 42
  test_size: 0.2
  calibration_method: sigmoid
  calibration_cv: 3
  prediction_sample_rows: 5000

tuning:
  enabled: true
  metric: average_precision
  n_trials: 12
  timeout_seconds: 600
  cv_folds: 3
  sample_size: 50000
