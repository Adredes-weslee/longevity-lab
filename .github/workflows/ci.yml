name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pdm.lock
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install pdm
          pdm install -G dev -G train --frozen-lockfile
      - name: Lint
        run: |
          pdm run ruff check src tests
      - name: Format
        run: |
          pdm run ruff format --check src tests
      - name: Typecheck
        run: |
          pdm run mypy src tests
      - name: Test
        run: |
          pdm run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pdm.lock
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install pdm
          pdm install -G dev --frozen-lockfile
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: |
          cd frontend
          npm ci
      - name: Install Playwright (Chromium)
        run: |
          cd frontend
          npx playwright install --with-deps chromium
      - name: Run E2E smoke tests
        run: |
          cd frontend
          npm run test:e2e
