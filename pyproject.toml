[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "longevity-lab"
version = "0.1.0"
description = "Local-first health risk communication and scenario modeling platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.4.1,<2",
  "fastapi>=0.121.1,<1",
  "joblib>=1.5.2,<2",
  "numpy>=2.3.4,<3",
  "pandas>=2.3.3,<3",
  "pydantic-settings>=2.11.0,<3",
  "pydantic>=2.12.3,<3",
  "pyarrow>=22.0.0,<23",
  "pyyaml>=6.0.2,<7",
  "scikit-learn>=1.7.2,<2",
  "uvicorn[standard]>=0.38.0,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1,<1",
  "mypy>=1.18.2,<2",
  "pre-commit>=4.3.0,<5",
  "pytest>=8.4.2,<9",
  "ruff>=0.14.2,<1",
]
notebook = [
    "ipykernel>=7.2.0",
    "jupyterlab>=4.5.6",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
]
train = [
    "hydra-core>=1.3.2",
    "lightgbm>=4.5.0,<5",
    "optuna>=4.8.0",
    "xgboost>=2.1.0,<4",
]
explainability = [
    "shap>=0.47.0,<1",
]
artifact-xgboost = [
    "shap>=0.47.0,<1",
    "xgboost>=2.1.0,<4",
]

[tool]
[tool.hatch.build.targets.wheel]
packages = ["src/longevity_lab"]

[tool.hatch.build.targets.wheel.force-include]
"conf" = "longevity_lab/conf"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["temp", "frontend", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
mypy_path = "src"
