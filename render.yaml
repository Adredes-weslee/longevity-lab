services:
  - type: web
    name: longevity-lab-api
    runtime: python
    plan: free
    buildCommand: python scripts/download_model_bundle.py && pip install --upgrade pip && pip install .
    startCommand: uvicorn longevity_lab.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: LONGEVITY_LAB_ENVIRONMENT
        value: production
      - key: LONGEVITY_LAB_ENGINE
        value: artifact
      - key: LONGEVITY_LAB_ARTIFACT_BUNDLE
        value: real-20260507-final
      - key: LONGEVITY_LAB_ARTIFACT_URL
        value: https://github.com/Adredes-weslee/longevity-lab/releases/download/model-real-20260507-final/real-20260507-final.zip
      - key: LONGEVITY_LAB_ARTIFACT_SHA256
        value: bb801b1892b4aa49a6a27345a2e0f1b2e4614b0e0d72716cd8c2a53b8a31a32e
      - key: LONGEVITY_LAB_CORS_ALLOW_ORIGINS
        value: https://longevity-lab-frontend.onrender.com
      - key: LONGEVITY_LAB_DATA_DIR
        value: data
      - key: LONGEVITY_LAB_ARTIFACTS_DIR
        value: artifacts

  - type: web
    name: longevity-lab-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://longevity-lab-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
