services:
  - type: web
    name: longevity-lab-api
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install .
    startCommand: uvicorn longevity_lab.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: LONGEVITY_LAB_ENVIRONMENT
        value: production
      - key: LONGEVITY_LAB_ENGINE
        value: demo
      - key: LONGEVITY_LAB_CORS_ALLOW_ORIGINS
        fromService:
          name: longevity-lab-frontend
          type: web
          property: host
      - key: LONGEVITY_LAB_DATA_DIR
        value: data
      - key: LONGEVITY_LAB_ARTIFACTS_DIR
        value: artifacts

  - type: web
    name: longevity-lab-frontend
    runtime: static
    plan: free
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: longevity-lab-api
          type: web
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
